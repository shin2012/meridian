name: iOS 화면 점검
on:
  workflow_dispatch:
    inputs:
      devices:
        description: "phone, ipad 또는 둘 다(phone ipad)"
        default: "phone ipad"

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | grep -viE "beta|_RC" | sort -V | tail -1)"
      - name: 빌드 (시뮬레이터)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Meridian.xcodeproj -scheme Meridian -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath $RUNNER_TEMP/dd \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: 화면 찍기
        timeout-minutes: 30
        env:
          SERVER: ${{ secrets.MERIDIAN_SERVER }}
          TOKEN: ${{ secrets.MERIDIAN_TOKEN }}
        run: bash ios/ci/shots.sh "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Meridian.app" shots ${{ inputs.devices }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
