name: 비밀값 검사

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --no-banner --redact -v
      - name: 서버 주소·토큰 하드코딩 금지
        run: |
          # 앱은 서버 주소와 토큰을 기기에서만 받는다. 코드에 http(s) 서버 주소나 토큰 형태가 있으면 실패.
          if grep -rnE 'https?://[a-z0-9.-]+\.(kr|com|net|io|space)' ios --include=*.swift | grep -vE 'apple\.com|w3\.org|example\.com'; then
            echo "코드에 서버 주소가 있습니다"; exit 1
          fi
          if grep -rnE '[0-9a-f]{40,}' ios --include=*.swift --include=*.plist; then
            echo "토큰처럼 보이는 값이 있습니다"; exit 1
          fi
